<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkingFriendsRU | Альбом</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b23; --line:#232b36; --text:#e6edf3;
    --muted:#8b98a8; --accent:#4aa8ff; --accent-dim:rgba(74,168,255,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:var(--accent); text-decoration:none}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(13,17,23,.94); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1500px; margin:0 auto; padding:13px 18px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{font-size:17px; font-weight:650; letter-spacing:.2px; display:flex; align-items:center; gap:9px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent)}
  .brand small{color:var(--muted); font-weight:400; font-size:14px}
  .crumbs{margin-left:auto; color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center}
  .crumbs a{color:var(--muted)}
  .crumbs a:hover{color:var(--accent)}

  main{max-width:1500px; margin:0 auto; padding:20px 18px 60px}
  h2.page-h{font-size:19px; margin:0 0 4px; font-weight:600}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px}

  /* список эпизодов */
  .eps{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .ep{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:block; transition:transform .15s,border-color .15s;
  }
  .ep:hover{transform:translateY(-3px); border-color:var(--accent)}
  .ep .cover{aspect-ratio:16/9; background:#0a0d12; position:relative}
  .ep .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .ep .tag{
    position:absolute; top:8px; left:8px; font-size:11px; font-weight:600;
    background:rgba(0,0,0,.72); color:#cfe3ff; padding:3px 7px; border-radius:5px;
    letter-spacing:.4px;
  }
  .ep .body{padding:10px 12px 12px}
  .ep .name{font-size:14px; font-weight:550; margin-bottom:3px}
  .ep .cnt{color:var(--muted); font-size:12px}

  /* галерея */
  .grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{
    position:relative; display:block; background:var(--card); border:1px solid var(--line);
    border-radius:10px; overflow:hidden; aspect-ratio:16/9; cursor:zoom-in;
    transition:transform .12s, border-color .12s;
  }
  .card:hover{transform:translateY(-2px); border-color:var(--accent)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;background:#0a0d12}
  .tc{
    position:absolute; bottom:6px; right:6px; font-size:11px;
    background:rgba(0,0,0,.72); padding:2px 6px; border-radius:5px;
    font-variant-numeric:tabular-nums; color:#cfd8e3;
  }

  /* лайтбокс */
  .lightbox{
    position:fixed; inset:0; background:rgba(5,7,10,.97); z-index:50;
    display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  .lightbox.open{display:flex}
  .lightbox img{max-width:96vw; max-height:80vh; object-fit:contain; border-radius:6px}
  .lb-bar{display:flex; gap:16px; align-items:center; margin-top:12px; color:var(--muted); font-size:13px}
  .lb-bar b{color:var(--text); font-variant-numeric:tabular-nums}
  .lb-btn{
    position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.07);
    border:0; color:#fff; font-size:26px; width:46px; height:72px; border-radius:9px; cursor:pointer;
  }
  .lb-btn:hover{background:rgba(255,255,255,.16)}
  .lb-prev{left:12px} .lb-next{right:12px}
  .lb-close{position:absolute; top:12px; right:14px; background:none; border:0; color:#fff; font-size:32px; cursor:pointer; line-height:1}
  .empty{color:var(--muted); text-align:center; padding:60px 0}
  footer{color:var(--muted); font-size:12px; text-align:center; padding:0 18px 34px}
  @media(max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:7px}
    .eps{grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:10px}
    .brand{font-size:15px}
    .bar{padding:11px 14px}
    main{padding:16px 14px 50px}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span>TalkingFriendsRU <small>| Альбом</small></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
</header>

<main id="view"></main>
<footer>Скринкапсы каждые 0,5 секунды · TalkingFriendsRU</footer>

<div class="lightbox" id="lb">
  <button class="lb-close" id="lbClose" aria-label="Закрыть">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Назад">‹</button>
  <img id="lbImg" alt="">
  <div class="lb-bar"><b id="lbPos"></b><span id="lbTc"></span></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Вперёд">›</button>
</div>

<script src="data/episodes.js"></script>
<script>
const EPS = window.EPISODES || [];
const view = document.getElementById("view");
const crumbs = document.getElementById("crumbs");

const timecode = (i, interval) => {
  const s = (i + 0.5) * interval;
  const m = Math.floor(s / 60);
  const r = (s - m * 60).toFixed(1).padStart(4, "0");
  return `${m}:${r}`;
};

/* ---------- список эпизодов ---------- */
function renderList(){
  crumbs.innerHTML = "";
  if (!EPS.length){
    view.innerHTML = '<div class="empty">Пока нет ни одного эпизода</div>';
    return;
  }
  const cards = EPS.map(ep => {
    const n = ep.frames.length;
    const cover = n ? ep.frames[0][0] : "";
    return `<a class="ep" href="#/${ep.code}">
      <div class="cover"><img loading="lazy" src="${cover}" alt="${ep.code}">
        <span class="tag">${ep.code}</span></div>
      <div class="body">
        <div class="name">${ep.title || ep.code}</div>
        <div class="cnt">${n} кадров · каждые ${ep.interval} с</div>
      </div>
    </a>`;
  }).join("");

  view.innerHTML = `
    <h2 class="page-h">Эпизоды</h2>
    <div class="sub">${EPS.length} ${EPS.length === 1 ? "эпизод" : "эпизодов"} · короткие серии</div>
    <div class="eps">${cards}</div>`;
}

/* ---------- галерея одного эпизода ---------- */
function renderGallery(code){
  const ep = EPS.find(e => e.code.toLowerCase() === code.toLowerCase());
  if (!ep){
    view.innerHTML = '<div class="empty">Эпизод не найден</div>';
    crumbs.innerHTML = '<a href="#">← Все эпизоды</a>';
    return;
  }
  crumbs.innerHTML = `<a href="#">Все эпизоды</a> <span>/</span> <span>${ep.code}</span>`;
  const cards = ep.frames.map(([thumb, full], i) => `
    <div class="card" data-i="${i}">
      <img loading="lazy" src="${thumb}" alt="кадр ${i + 1}">
      <span class="tc">${timecode(i, ep.interval)}</span>
    </div>`).join("");

  view.innerHTML = `
    <h2 class="page-h">${ep.title || ep.code}</h2>
    <div class="sub">${ep.frames.length} кадров · интервал ${ep.interval} с · ${ep.code}</div>
    <div class="grid">${cards}</div>`;

  view.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openLb(ep, +el.dataset.i));
  });
}

/* ---------- лайтбокс ---------- */
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lbImg");
let curEp = null, cur = 0;

function openLb(ep, i){ curEp = ep; cur = i; paint(); lb.classList.add("open"); }
function paint(){
  const [, full] = curEp.frames[cur];
  lbImg.src = full;
  document.getElementById("lbPos").textContent = `${cur + 1} / ${curEp.frames.length}`;
  document.getElementById("lbTc").textContent = timecode(cur, curEp.interval);
}
const step = d => { cur = (cur + d + curEp.frames.length) % curEp.frames.length; paint(); };
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
document.getElementById("lbClose").onclick = () => lb.classList.remove("open");
lb.addEventListener("click", e => { if (e.target === lb) lb.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Escape") lb.classList.remove("open");
});
let x0 = null;
lb.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
lb.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  x0 = null;
}, {passive:true});

/* ---------- роутинг ---------- */
function route(){
  const m = location.hash.match(/^#\/(.+)$/);
  if (m) renderGallery(decodeURIComponent(m[1]));
  else renderList();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
