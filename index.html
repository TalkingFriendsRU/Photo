<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkingFriendsRU | Альбом</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b23; --line:#232b36; --text:#e6edf3;
    --muted:#8b98a8; --accent:#4aa8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent}
  a{color:var(--accent); text-decoration:none}

  header{position:sticky; top:0; z-index:20; background:rgba(13,17,23,.94);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
  .bar{max-width:1500px; margin:0 auto; padding:13px 18px; display:flex;
    align-items:center; gap:12px; flex-wrap:wrap}
  .brand{font-size:17px; font-weight:650; letter-spacing:.2px; display:flex; align-items:center; gap:9px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent)}
  .brand small{color:var(--muted); font-weight:400; font-size:14px}
  .crumbs{margin-left:auto; color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--accent)}

  main{max-width:1500px; margin:0 auto; padding:20px 18px 60px}
  h2.page-h{font-size:20px; margin:0 0 4px; font-weight:600}
  .sub{color:var(--muted); font-size:13px; margin-bottom:16px}

  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--muted);
    padding:6px 13px; border-radius:20px; font-size:13px; cursor:pointer; white-space:nowrap}
  .chip:hover{border-color:var(--accent); color:var(--text)}
  .chip.on{background:rgba(74,168,255,.15); border-color:var(--accent); color:#cfe6ff}

  .series{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .sr{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:block; transition:transform .15s,border-color .15s}
  .sr:hover{transform:translateY(-3px); border-color:var(--accent)}
  .sr .cover{aspect-ratio:16/9; background:#0a0d12}
  .sr .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .sr .body{padding:12px 14px 14px}
  .sr .name{font-size:15px; font-weight:600; line-height:1.3; margin-bottom:4px}
  .sr .cnt{color:var(--muted); font-size:12px}

  .eps{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
  .ep{background:var(--card); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:block; transition:transform .15s,border-color .15s}
  .ep:hover{transform:translateY(-3px); border-color:var(--accent)}
  .ep .cover{aspect-ratio:16/9; background:#0a0d12; position:relative}
  .ep .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .ep .tag{position:absolute; top:8px; left:8px; font-size:11px; font-weight:600;
    background:rgba(0,0,0,.72); color:#cfe3ff; padding:3px 7px; border-radius:5px}
  .ep .body{padding:10px 12px 12px}
  .ep .name{font-size:14px; font-weight:550; margin-bottom:3px; line-height:1.35}
  .ep .cnt{color:var(--muted); font-size:12px}

  .grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card{position:relative; display:block; background:var(--card); border:1px solid var(--line);
    border-radius:10px; overflow:hidden; aspect-ratio:16/9; cursor:zoom-in;
    transition:transform .12s, border-color .12s}
  .card:hover{transform:translateY(-2px); border-color:var(--accent)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;background:#0a0d12}

  .lightbox{position:fixed; inset:0; background:rgba(5,7,10,.97); z-index:50;
    display:none; align-items:center; justify-content:center; flex-direction:column}
  .lightbox.open{display:flex}
  .lightbox img{max-width:96vw; max-height:80vh; object-fit:contain; border-radius:6px}
  .lb-bar{display:flex; gap:16px; align-items:center; margin-top:12px; color:var(--muted); font-size:13px}
  .lb-bar b{color:var(--text); font-variant-numeric:tabular-nums}
  .lb-btn{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.07);
    border:0; color:#fff; font-size:26px; width:46px; height:72px; border-radius:9px; cursor:pointer}
  .lb-btn:hover{background:rgba(255,255,255,.16)}
  .lb-prev{left:12px} .lb-next{right:12px}
  .lb-close{position:absolute; top:12px; right:14px; background:none; border:0; color:#fff; font-size:32px; cursor:pointer; line-height:1}
  .empty,.loading{color:var(--muted); text-align:center; padding:70px 0}
  @media(max-width:520px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:7px}
    .eps{grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px}
    .series{grid-template-columns:1fr}
    .brand{font-size:15px} .bar{padding:11px 14px} main{padding:16px 14px 50px}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="dot"></span>TalkingFriendsRU <small>| Альбом</small></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
</header>

<main id="view"><div class="loading">Загрузка…</div></main>

<div class="lightbox" id="lb">
  <button class="lb-close" id="lbClose" aria-label="Закрыть">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Назад">‹</button>
  <img id="lbImg" alt="">
  <div class="lb-bar"><b id="lbPos"></b></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Вперёд">›</button>
</div>

<script src="data/catalog.js"></script>
<script>
const CAT = window.CATALOG || {series:[], episodes:[]};
const SERIES = CAT.series || [];
const EPS = CAT.episodes || [];
const view = document.getElementById("view");
const crumbs = document.getElementById("crumbs");
let curLabel = null;

/* ---------- 1. список сериалов ---------- */
function renderSeries(){
  crumbs.innerHTML = "";
  if (!SERIES.length){ view.innerHTML = '<div class="empty">Пока нет ни одного сериала</div>'; return; }

  const cards = SERIES.map(s => {
    const eps = EPS.filter(e => e.series === s.id);
    const frames = eps.reduce((a, e) => a + e.count, 0);
    const cover = eps.length ? eps[0].cover : "";
    return `<a class="sr" href="#s/${s.id}">
      <div class="cover"><img loading="lazy" src="${cover}" alt=""></div>
      <div class="body">
        <div class="name">${s.name}</div>
        <div class="cnt">${eps.length} эпизодов · ${frames} кадров</div>
      </div></a>`;
  }).join("");

  view.innerHTML = `
    <h2 class="page-h">Сериалы</h2>
    <div class="sub">${SERIES.length} ${SERIES.length===1?"сериал":"сериалов"} · выбери сериал</div>
    <div class="series">${cards}</div>`;
}

/* ---------- 2. эпизоды сериала ---------- */
function renderSeriesView(sid){
  const s = SERIES.find(x => x.id === sid);
  if (!s){ location.hash = ""; return; }
  crumbs.innerHTML = `<a href="#">Сериалы</a> <span>/</span> <span>${s.name}</span>`;

  const all = EPS.filter(e => e.series === sid);
  const labels = [...new Set(all.map(e => e.label).filter(Boolean))];
  const chips = [`<span class="chip ${curLabel===null?'on':''}" data-l="all">Все</span>`]
    .concat(labels.map(l => `<span class="chip ${curLabel===l?'on':''}" data-l="${l}">${l}</span>`))
    .join("");

  const list = curLabel === null ? all : all.filter(e => e.label === curLabel);
  const cards = list.map(ep => `
    <a class="ep" href="#/${ep.code}">
      <div class="cover"><img loading="lazy" src="${ep.cover}" alt="">
        <span class="tag">${ep.ep ? `E${ep.ep}` : ep.code}</span></div>
      <div class="body">
        <div class="name">${ep.title}</div>
        <div class="cnt">${ep.count} кадров</div>
      </div></a>`).join("");

  const frames = all.reduce((a, e) => a + e.count, 0);
  view.innerHTML = `
    <h2 class="page-h">${s.name}</h2>
    <div class="sub">${all.length} эпизодов · ${frames} кадров</div>
    ${labels.length > 1 ? `<div class="chips">${chips}</div>` : ""}
    <div class="eps">${cards}</div>`;

  view.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    curLabel = c.dataset.l === "all" ? null : c.dataset.l;
    renderSeriesView(sid);
  }));
}

/* ---------- 3. галерея эпизода ---------- */
function loadFrames(code){
  return new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = `data/frames/${code}.js`;
    sc.onload = () => resolve(window.FRAMES);
    sc.onerror = () => reject(new Error("нет файла кадров"));
    document.head.appendChild(sc);
  });
}

async function renderGallery(code){
  const meta = EPS.find(e => e.code.toLowerCase() === code.toLowerCase());
  if (!meta){ view.innerHTML = '<div class="empty">Эпизод не найден</div>'; return; }
  const s = SERIES.find(x => x.id === meta.series);
  crumbs.innerHTML = `<a href="#">Сериалы</a> <span>/</span>
    <a href="#s/${meta.series}">${s ? s.name : meta.series}</a> <span>/</span> <span>${meta.title}</span>`;

  view.innerHTML = '<div class="loading">Загружаем кадры…</div>';
  let data;
  try { data = await loadFrames(meta.code); }
  catch(e){ view.innerHTML = '<div class="empty">Не удалось загрузить кадры эпизода</div>'; return; }

  const cards = data.frames.map(([thumb], i) => `
    <div class="card" data-i="${i}">
      <img loading="lazy" src="${thumb}" alt="кадр ${i+1}" data-fb="${data.frames[i][2] || ""}">
    </div>`).join("");

  const sub = [s ? s.name : "", meta.label, meta.ep ? `эпизод ${meta.ep}` : ""].filter(Boolean).join(" · ");

  view.innerHTML = `
    <h2 class="page-h">${meta.title}</h2>
    <div class="sub">${sub} · ${data.frames.length} кадров</div>
    <div class="grid">${cards}</div>`;

  view.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openLb(data, +el.dataset.i));
    const img = el.querySelector("img");
    if (img) img.addEventListener("error", () => {
      const fb = img.dataset.fb;
      if (fb && img.src !== fb){ img.src = fb; img.dataset.fb = ""; }
    });
  });
}

/* ---------- лайтбокс ---------- */
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lbImg");
lbImg.addEventListener("error", () => {
  const fb = lbImg.dataset.fb;
  if (fb && lbImg.src !== fb){ lbImg.src = fb; lbImg.dataset.fb = ""; }
});
let curData = null, cur = 0;

function openLb(data, i){ curData = data; cur = i; paint(); lb.classList.add("open"); }
function paint(){
  const f = curData.frames[cur];
  lbImg.dataset.fb = f[2] || "";
  lbImg.src = f[1];
  document.getElementById("lbPos").textContent = `${cur+1} / ${curData.frames.length}`;
}
const step = d => { cur = (cur + d + curData.frames.length) % curData.frames.length; paint(); };
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
document.getElementById("lbClose").onclick = () => lb.classList.remove("open");
lb.addEventListener("click", e => { if (e.target === lb) lb.classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Escape") lb.classList.remove("open");
});
let x0 = null;
lb.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
lb.addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  x0 = null;
}, {passive:true});

/* ---------- роутинг ---------- */
function route(){
  const hash = location.hash.replace(/^#/, "");
  const ms = hash.match(/^s\/(.+)$/);
  const me = hash.match(/^\/(.+)$/);
  if (ms){ curLabel = null; renderSeriesView(decodeURIComponent(ms[1])); }
  else if (me){ renderGallery(decodeURIComponent(me[1])); }
  else { curLabel = null; renderSeries(); }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
